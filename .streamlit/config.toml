# Frostline theme and server settings (read when the app is started from the repository root).
# The [theme] values mirror the design tokens in UI/frostline/ui.py (CSS) and UI/frostline/charts.py (figures).
[theme]
base = "light"
primaryColor = "#0071E3"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
linkColor = "#0066CC"
borderColor = "#D2D2D7"
dataframeBorderColor = "#E5E5EA"
dataframeHeaderBackgroundColor = "#F5F5F7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "980px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
codeFont = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
headingFontWeights = 700
chartCategoricalColors = ["#0071E3", "#E8700A", "#248A3D"]

[theme.sidebar]
backgroundColor = "#FBFBFD"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E5E5EA"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
